# Internal nginx for the www-kepler container. Listens on :8088 (host
# network); the surrounding reverse proxy is expected to forward /kepler/
# requests here. All assets are emitted by Vite under /kepler/ so the
# build's relative paths land correctly behind the public prefix.

server {
    listen 8088 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative. Otherwise nginx swaps in $host:$server_port and
    # leaks the internal :8088 (or, after proxy_redirect at the edge, :8080)
    # into the Location header, exposing the listener port to the browser.
    absolute_redirect off;

    # Redirect bare /kepler to /kepler/ so relative asset URLs (e.g.
    # /kepler/assets/foo.js) resolve consistently.
    location = /kepler {
        return 301 /kepler/;
    }

    # SPA: serve under /kepler/ with index.html fallback for client routing.
    location /kepler/ {
        try_files $uri $uri/ /kepler/index.html;
    }

    # Health endpoint — used by the container healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
